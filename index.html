<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log watcher</title>
</head>

<body>
  Tailf implementation (Log watcher)
  <div id="logContent" style="white-space: pre-wrap;"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const logContentDiv = document.getElementById("logContent");
    const socket = io();
    socket.on("logFile", (data) => {
      logContentDiv.innerHTML += data;
    })
  </script>
</body>

</html>
